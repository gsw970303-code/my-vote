<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunch Express v2.7</title>
    <style>
        :root { --primary: #00ff88; --bg: #0f172a; --card: #1e293b; --accent: #f43f5e; --disabled: #334155; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: white; margin: 0; overflow-x: hidden; }
        .container { width: 100%; max-width: 480px; margin: 0 auto; padding: 20px; text-align: center; }
        .card { background: var(--card); padding: 30px; border-radius: 24px; border: 1px solid #475569; }
        .timer { font-size: 64px; color: var(--primary); font-weight: 800; margin: 10px 0; font-variant-numeric: tabular-nums; }
        .grid-select { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .select-item { background: #0f172a; padding: 18px; border-radius: 16px; border: 2px solid #334155; cursor: pointer; transition: 0.1s; }
        .select-item.active { background: var(--primary); color: #0f172a; font-weight: bold; border-color: var(--primary); transform: scale(0.98); }
        .btn-main { width: 100%; padding: 20px; background: var(--primary); color: #0f172a; border: none; border-radius: 16px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-main:disabled { background: var(--disabled); color: #64748b; }
        .stats-box { margin-top: 25px; padding: 20px; background: rgba(0,0,0,0.2); border-radius: 16px; text-align: left; }
        .stat-line { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .stat-bar { height: 6px; background: var(--primary); border-radius: 3px; }
        .hidden { display: none; }
        .form-disabled { pointer-events: none; opacity: 0.3; filter: grayscale(1); }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading" style="margin-top:100px;">✨ 데이터 동기화 중...</div>

        <div id="votingSection" class="hidden">
            <div class="card">
                <h2>🍴 식당 투표</h2>
                <div class="timer" id="voteTimer">00:00</div>
                <div class="grid-select" id="resGrid"></div>
            </div>
        </div>

        <div id="waitSection" class="hidden">
            <div class="card">
                <h2 style="color: var(--primary)">투표 완료! ✅</h2>
                <p>동료들의 선택을 기다리는 중...</p>
                <div class="timer" id="waitTimer">00:00</div>
                <button onclick="reVote()" style="background:none; border:none; color:#94a3b8; text-decoration:underline; cursor:pointer; margin-top:20px;">식당 다시 고르기</button>
            </div>
        </div>

        <div id="orderingSection" class="hidden">
            <div class="card">
                <h2 id="winnerTitle" style="color: var(--primary)">🎯 오늘의 식당</h2>
                <div id="formContainer">
                    <div class="grid-select" id="userGrid"></div>
                    <div class="grid-select" id="menuGrid"></div>
                    <button class="btn-main" id="submitBtn" onclick="submitOrder()">주문 제출하기</button>
                </div>
                <div id="orderedMsg" class="hidden">
                    <div style="color: var(--primary); font-weight: bold; margin-bottom: 10px;">주문 완료! 🍱</div>
                    <button onclick="reOrder()" style="background:none; border:none; color:#94a3b8; text-decoration:underline; cursor:pointer;">메뉴 다시 고르기</button>
                    <div class="stats-box">
                        <div style="font-weight:bold; margin-bottom:15px; color:var(--primary);">🔥 실시간 메뉴 현황</div>
                        <div id="statsList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzpnXjA_Arp2uezC3XUdT-59Xc7Xj48-zXUDcN_sSLBY3-aCSu4vUztzt857t4rHoTOKw/exec";
        if(!localStorage.getItem('deviceId')) localStorage.setItem('deviceId', 'id_' + Math.random().toString(36).substr(2, 9));
        const deviceId = localStorage.getItem('deviceId');
        let state = {};
        let selected = { res: null, user: null, menu: null, price: 0 };

        async function updateState() {
            try {
                const res = await fetch(GAS_URL + "?type=get");
                state = await res.json();
                renderUI();
            } catch (e) {}
        }

        function renderUI() {
            document.getElementById('loading').classList.add('hidden');
            if (state.status === "VOTING") {
                updateTimer('voteTimer', state.timeLeft);
                updateTimer('waitTimer', state.timeLeft);
                if (localStorage.getItem('voted_2.7')) {
                    showSection('waitSection');
                } else {
                    showSection('votingSection');
                    if (!document.getElementById('resGrid').children.length) 
                        renderGrid('resGrid', state.restaurants, (v) => { selected.res = v; sendVote(); });
                }
            } else if (state.status === "ORDERING") {
                showSection('orderingSection');
                document.getElementById('winnerTitle').innerText = `🏆 ${state.winner}`;
                if (!document.getElementById('userGrid').children.length) {
                    renderGrid('userGrid', state.employees, (v) => selected.user = v);
                    renderGrid('menuGrid', state.menus, (obj) => { selected.menu = obj.name; selected.price = obj.price; }, true);
                }
                const isOrdered = localStorage.getItem('ordered_2.7');
                setFormDisabled(!!isOrdered);
                if (isOrdered) renderStats();
            }
        }

        function renderStats() {
            const list = document.getElementById('statsList');
            list.innerHTML = '';
            const sorted = Object.entries(state.menuStats || {}).sort((a,b) => b[1] - a[1]);
            const max = Math.max(...Object.values(state.menuStats || {}), 1);
            sorted.slice(0, 3).forEach(([name, count]) => {
                const width = (count / max) * 100;
                list.innerHTML += `<div style="margin-bottom:12px;"><div class="stat-line"><span>${name}</span><span>${count}명</span></div><div style="width:100%; background:#334155; height:6px; border-radius:3px;"><div class="stat-bar" style="width:${width}%"></div></div></div>`;
            });
        }

        function setFormDisabled(disabled) {
            document.getElementById('formContainer').classList.toggle('form-disabled', disabled);
            document.getElementById('submitBtn').disabled = disabled;
            document.getElementById('orderedMsg').classList.toggle('hidden', !disabled);
        }

        function showSection(id) {
            ['votingSection', 'waitSection', 'orderingSection'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function updateTimer(id, seconds) {
            const el = document.getElementById(id);
            if(!el) return;
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            el.innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }

        function renderGrid(containerId, data, callback, isMenu = false) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'select-item';
                div.innerText = isMenu ? `${item.name}\n${item.price.toLocaleString()}원` : item;
                div.onclick = () => {
                    container.querySelectorAll('.select-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    callback(item);
                };
                container.appendChild(div);
            });
        }

        function sendVote() {
            localStorage.setItem('voted_2.7', 'true');
            showSection('waitSection');
            fetch(GAS_URL, { method: "POST", body: JSON.stringify({ type: "VOTE", deviceId: deviceId, choice: selected.res }) });
        }

        function reVote() {
            localStorage.removeItem('voted_2.7');
            document.getElementById('resGrid').innerHTML = '';
            updateState();
        }

        function submitOrder() {
            if(!selected.user || !selected.menu) return alert("성함과 메뉴를 선택해주세요!");
            localStorage.setItem('ordered_2.7', 'true');
            setFormDisabled(true);
            fetch(GAS_URL, { method: "POST", body: JSON.stringify({ 
                type: "ORDER", userName: selected.user, restaurant: state.winner, menu: selected.menu, price: selected.price 
            }) }).then(updateState);
        }

        function reOrder() {
            localStorage.removeItem('ordered_2.7');
            setFormDisabled(false);
        }

        setInterval(updateState, 3000);
        updateState();
    </script>
</body>
</html>

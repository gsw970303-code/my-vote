<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunch Pro v10.1</title>
    <style>
        :root { --primary: #00ff88; --bg: #0f172a; --card: #1e293b; --accent: #f43f5e; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: white; margin: 0; text-align: center; }
        .container { max-width: 480px; margin: 0 auto; padding: 20px; }
        .card { background: var(--card); padding: 30px; border-radius: 24px; border: 1px solid #475569; margin-bottom: 20px; position: relative; }
        .timer { font-size: 64px; color: var(--primary); font-weight: 800; margin: 10px 0; font-variant-numeric: tabular-nums; }
        .rule-text { font-size: 13px; color: #fba51a; font-weight: bold; line-height: 1.5; margin: 5px 0 15px 0; background: rgba(251, 165, 26, 0.1); padding: 8px; border-radius: 8px; border: 1px dashed rgba(251, 165, 26, 0.3); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .item { background: #0f172a; padding: 18px; border-radius: 16px; border: 2px solid #334155; cursor: pointer; transition: 0.1s; position: relative; }
        .item.active { background: var(--primary); color: #0f172a; font-weight: bold; border-color: var(--primary); }
        .btn-main { width: 100%; padding: 16px; background: var(--primary); color: #0f172a; border: none; border-radius: 16px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-sub { width: 100%; padding: 10px; background: #334155; color: white; border: 1px solid #475569; border-radius: 10px; font-size: 13px; font-weight: bold; cursor: pointer; margin-bottom: 12px; }
        .progress-container { width: 100%; background: #334155; height: 8px; border-radius: 4px; margin-top: 10px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--primary); transition: 0.3s; width: 0%; }
        .lucky-btn { background: #334155; color: #94a3b8; border: 1px solid #475569; padding: 8px 15px; border-radius: 20px; font-size: 12px; margin-bottom: 15px; cursor: pointer; width: 100%; }
        .hidden { display: none; }
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; background: #0f172a; border-radius: 12px; overflow: hidden; }
        .admin-table th, .admin-table td { padding: 12px; border-bottom: 1px solid #334155; text-align: left; }
        .admin-table th { background: #334155; color: var(--primary); }
        .summary-card { background: rgba(0, 255, 136, 0.1); border: 1px solid var(--primary); padding: 15px; border-radius: 16px; margin-top: 15px; text-align: left; }
        .exclude-cb { transform: scale(1.2); cursor: pointer; }
        .excluded-row { text-decoration: line-through; color: #64748b !important; background: rgba(244, 63, 94, 0.05); }
        .not-selected { color: #f43f5e; font-style: italic; }
        .pside-container { background: #0f172a; padding: 12px; border-radius: 12px; border: 1px dashed #475569; text-align: left; margin-top: 15px; }
        .pside-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; font-size: 14px; }
        .pside-item input { transform: scale(1.2); margin-right: 8px; cursor: pointer; }
        .admin-navbar { display: flex; background: #0f172a; border-radius: 16px; padding: 5px; margin-bottom: 15px; border: 1px solid #334155; }
        .admin-nav-item { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-size: 14px; font-weight: bold; border-radius: 12px; color: #94a3b8; transition: 0.2s; }
        .admin-nav-item.active { background: var(--primary); color: #0f172a; }
        .badge-recent { position: absolute; top: 5px; right: 5px; background: #fba51a; color: #0f172a; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 8px; }
        
        /* 🎰 [④번 반영] 슬롯머신 역동적인 롤링 이펙트 애니메이션 스타일 */
        @keyframes slotBlurEffect {
            0% { transform: scale(1.0); filter: blur(0px); background: #0f172a; border-color: #334155; }
            50% { transform: scale(1.05); filter: blur(2px); background: rgba(244, 63, 94, 0.3); border-color: var(--accent); color: #ffffff; }
            100% { transform: scale(1.0); filter: blur(0px); background: #0f172a; border-color: #334155; }
        }
        .slot-rolling { animation: slotBlurEffect 0.12s infinite alternate; z-index: 10; box-shadow: 0 0 15px rgba(244, 63, 94, 0.4); }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading">⚡ 데이터 동기화 중...</div>

        <div id="adminStartSection" class="hidden" style="background:#334155; padding:15px; border-radius:12px; margin-bottom:20px; border:1px dashed var(--primary);">
            <h3 style="margin:0 0 10px 0; font-size:16px;">🛠 관리자 빠른 제어</h3>
            <button class="btn-sub" onclick="copyLaunchNotice()">📋 [1단계] 투표 안내 쪽지 공지문 복사</button>
            <button class="btn-main" onclick="startSystem()">🚀 [2단계] 점심 투표 시작 (데이터 초기화)</button>
        </div>

        <div id="waitingSection" class="hidden">
            <div class="card"><h2>😴 대기 중</h2><p style="color:#94a3b8;">관리자가 투표를 시작하면 활성화됩니다.</p></div>
        </div>

        <div id="votingSection" class="hidden">
            <div class="card">
                <h2>🍴 식당 투표 (2분 마감)</h2>
                <div class="timer" id="voteTimer">02:00</div>
                <div class="rule-text">📢 식당은 과반수로 정해지게 됩니다<br>(미투표 시 투표인원들 중 과반수로 가게 됨)</div>
                <div class="progress-container"><div id="voteProgress" class="progress-bar"></div></div>
                <p id="voteCountText" style="font-size:12px; color:var(--primary); margin-top:5px;"></p>
                <div class="grid" id="resGrid"></div>
            </div>
        </div>

        <div id="orderingSection" class="hidden">
            <div class="card">
                <h2 id="winnerTitle" style="color:var(--primary)">🏆 오늘의 식당</h2>
                <div id="formContainer">
                    <div class="grid" id="userGrid"></div>
                    <hr style="border:0; border-top:1px solid #334155; margin:20px 0;">
                    <button id="randomBtn" class="lucky-btn" onclick="randomMenuSlot()">🎲 결정 장애? 슬롯머신!</button>
                    <div class="grid" id="menuGrid"></div>
                    
                    <div id="doubleSizeArea" class="pside-container hidden" style="border-color: var(--primary);">
                        <label style="display:flex; align-items:center; cursor:pointer; font-weight:bold; color:var(--primary);">
                            <input type="checkbox" id="doubleSizeCb" style="transform:scale(1.4); margin-right:10px;" onchange="calcDoublePrice()"> 
                            🍜 곱빼기로 변경 (<span id="doublePriceText">0</span>원 추가)
                        </label>
                    </div>

                    <div id="personalSideArea" class="pside-container hidden">
                        <span style="font-size:13px; color:var(--primary); font-weight:bold;">🥤 추가 선택 (선택 사항)</span>
                        <div id="personalSideList" style="margin-top:8px;"></div>
                    </div>

                    <button class="btn-main" id="submitBtn" onclick="submitOrder()" style="margin-top:20px;">주문 제출하기</button>
                </div>
                <div id="orderedMsg" class="hidden">
                    <div style="background:rgba(0,255,136,0.1); padding:15px; border-radius:12px; margin-bottom:15px;">
                        <b style="color:var(--primary)">주문 완료!</b><br>
                        <span style="font-size:13px; color:#94a3b8;">메뉴 변경 시 구수완 사원에게 메신저 부탁드립니다.</span>
                    </div>
                    <button onclick="reOrder()" style="color:#94a3b8; background:none; border:none; text-decoration:underline; cursor:pointer;">메뉴 다시 고르기</button>
                </div>
            </div>
        </div>

        <div id="adminDashboard" class="hidden">
            <div class="admin-navbar">
                <div class="admin-nav-item active" id="tabBtn1" onclick="switchAdminTab(1)">📊 실시간 정산</div>
                <div class="admin-nav-item" id="tabBtn2" onclick="switchAdminTab(2)">📂 히스토리 장부</div>
            </div>

            <div id="adminTabContent1" class="card" style="border: 1px solid var(--primary); padding: 20px;">
                <button class="btn-sub" onclick="copyRecallNotice()">🚨 미입력자 소환 메신저 문구 복사</button>
                
                <div id="sideMenuArea" class="hidden">
                    <p style="font-size:13px; color:var(--primary); text-align:left; font-weight:bold;">✨ 사이드 메뉴 일괄 추가</p>
                    <div class="grid" id="sideGrid" style="margin-bottom:20px;"></div>
                </div>
                <div id="adminOrderList"></div>
                <div id="adminSummary" class="summary-card"></div>
                
                <button class="btn-main" id="btnSaveHistory" onclick="saveTodayHistory()" style="margin-top:20px; background:#fba51a; color:#0f172a;">💾 오늘의 점심 최종 확정 및 기록</button>
            </div>

            <div id="adminTabContent2" class="card hidden" style="border: 1px solid #475569; padding: 20px; text-align:left;">
                <h3 style="color:var(--primary); margin-top:0;">📂 과거 점심 기록 조회 장부</h3>
                
                <div style="margin-bottom:15px; display:flex; gap:10px;">
                    <select id="filterRestaurant" style="flex:1; padding:10px; border-radius:8px; background:#0f172a; color:white; border:1px solid #475569; font-size:13px;" onchange="filterHistoryTable()">
                        <option value="">모든 식당 필터</option>
                    </select>
                    <select id="filterDate" style="flex:1; padding:10px; border-radius:8px; background:#0f172a; color:white; border:1px solid #475569; font-size:13px;" onchange="filterHistoryTable()">
                        <option value="">모든 날짜 필터</option>
                    </select>
                </div>

                <div id="historyTableContainer" style="max-height:380px; overflow-y:auto; border:1px solid #334155; border-radius:12px;">
                    <table class="admin-table" id="viewHistoryTable" style="margin-top:0;">
                        <thead><tr><th>날짜</th><th>식당</th><th>이름</th><th>메뉴</th><th>가격</th></tr></thead>
                        <tbody id="historyTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwZa1_UC0C97F0qukF6epgSbG2f0GmtH_DNgzW0GUeBgax6Gc60sNz7xFxEF16CN_cmQw/exec";
        const isAdmin = new URLSearchParams(window.location.search).get('admin') === 'true';
        if(!localStorage.getItem('deviceId')) localStorage.setItem('deviceId', 'id_' + Math.random().toString(36).substr(2, 9));
        const deviceId = localStorage.getItem('deviceId');
        
        let state = {};
        let selected = { res: null, user: null, menu: null, price: 0, rawMenuName: null, doubleFee: 0 };
        let excludedUsers = new Set(); 
        let timerInterval;

        async function updateState() {
            try {
                const res = await fetch(GAS_URL + "?type=get");
                state = await res.json();
                renderUI();
                if(isAdmin && state.status === "ORDERING") {
                    renderAdminDashboard();
                    renderHistoryLogRoom();
                }
            } catch (e) {}
        }

        function copyLaunchNotice() {
            const dateStr = state.sysDate || `${new Date().getMonth()+1}.${new Date().getDate()}`;
            const link = window.location.href.split('?')[0];
            const text = `${dateStr} 회계팀 점심 투표의 건\n\n안녕하십니까 회계팀 구수완입니다!\n\n금일 점심 투표를 진행하고자 하오니 아래 링크를 클릭하시어\n투표 및 메뉴 선택을 진행해주시기 바랍니다!\n\n링크: ${link}\n\n감사합니다.\n구수완 올림`;
            navigator.clipboard.writeText(text);
            alert("📋 투표 시작 안내 문구가 클립보드에 복사되었습니다.");
        }

        function copyRecallNotice() {
            let unselectedUsers = [];
            let userOrdersMap = {};
            state.orderData.forEach(o => { if(!o.name.includes("[사이드]")) userOrdersMap[o.name] = true; });
            state.employees.forEach(emp => {
                if(!excludedUsers.has(emp) && !userOrdersMap[emp]) unselectedUsers.push(emp);
            });
            if(unselectedUsers.length === 0) return alert("✅ 미선택자가 없습니다!");
            const text = `🔔 오늘 점심 주문 미입력자 안내: [ ${unselectedUsers.join(', ')} ] 님은 마감 전이니 얼른 대시보드에서 메뉴를 선택해 주세요!`;
            navigator.clipboard.writeText(text);
            alert("📋 미선택자 리콜 문구가 클립보드에 복사되었습니다!");
        }

        function renderUI() {
            document.getElementById('loading').classList.add('hidden');
            if(isAdmin) document.getElementById('adminStartSection').classList.remove('hidden');
            ['waitingSection', 'votingSection', 'orderingSection'].forEach(s => document.getElementById(s).classList.add('hidden'));

            if(state.status === "WAITING") {
                document.getElementById('waitingSection').classList.remove('hidden');
                document.getElementById('adminDashboard').classList.add('hidden');
            } else if(state.status === "VOTING") {
                document.getElementById('votingSection').classList.remove('hidden');
                document.getElementById('adminDashboard').classList.add('hidden');
                if(!document.getElementById('resGrid').children.length) 
                    renderGrid('resGrid', state.restaurants, (v) => { selected.res = v; sendVote(); });
                startLocalTimer(state.endTime);
                const percent = (state.voteCount / state.totalCount) * 100;
                document.getElementById('voteProgress').style.width = percent + '%';
                document.getElementById('voteCountText').innerText = `참여 현황: ${state.voteCount} / ${state.totalCount}`;
            } else if(state.status === "ORDERING") {
                document.getElementById('orderingSection').classList.remove('hidden');
                document.getElementById('winnerTitle').innerText = `🏆 ${state.winner}`;
                
                const isOrdered = localStorage.getItem('ordered_6.0');
                if(!document.getElementById('userGrid').children.length) {
                    renderGrid('userGrid', state.employees, (v) => {
                        selected.user = v;
                        highlightRecentMenu();
                    });
                    renderGrid('menuGrid', state.menus, (obj) => selectMainMenu(obj), true);
                    
                    const pSideArea = document.getElementById('personalSideArea');
                    const pSideList = document.getElementById('personalSideList');
                    if(state.personalSides && state.personalSides.length > 0) {
                        pSideArea.classList.remove('hidden');
                        pSideList.innerHTML = '';
                        state.personalSides.forEach((side) => {
                            pSideList.innerHTML += `
                                <div class="pside-item">
                                    <label><input type="checkbox" class="pside-cb" data-name="${side.name}" data-price="${side.price}"> ${side.name.replace('(개인사이드)','').trim()}</label>
                                    <span style="color:#94a3b8;">+${side.price.toLocaleString()}원</span>
                                </div>`;
                        });
                    } else { pSideArea.classList.add('hidden'); }
                }
                setFormDisabled(!!isOrdered);
            }
        }

        function highlightRecentMenu() {
            if(!selected.user || !state.historyData) return;
            const myHistory = state.historyData.filter(h => h.name === selected.user && h.restaurant === state.winner);
            document.querySelectorAll('#menuGrid .item').forEach(el => {
                const badge = el.querySelector('.badge-recent');
                if(badge) badge.remove();
                
                if(myHistory.length > 0) {
                    const cleanItemName = el.innerText.split('\n')[0].replace(/\(곱빼기 가능:.*\)/g, '').trim();
                    const cleanHistoryName = myHistory[myHistory.length - 1].menu.replace(' (곱빼기)', '').replace(/\(곱빼기 가능:.*\)/g, '').trim();
                    if(cleanItemName === cleanHistoryName) {
                        el.innerHTML += `<span class="badge-recent">늘 먹던 것 ⭐</span>`;
                    }
                }
            });
        }

        function selectMainMenu(obj) {
            selected.rawMenuName = obj.name;
            selected.price = Number(obj.price);
            
            const doubleArea = document.getElementById('doubleSizeArea');
            const doubleCb = document.getElementById('doubleSizeCb');
            doubleCb.checked = false;
            selected.doubleFee = 0;

            const match = obj.name.match(/\(곱빼기 가능:(\d+)\)/);
            if(match) {
                selected.doubleFee = Number(match[1]);
                document.getElementById('doublePriceText').innerText = selected.doubleFee.toLocaleString();
                doubleArea.classList.remove('hidden');
            } else {
                doubleArea.classList.add('hidden');
            }
            selected.menu = obj.name.replace(/\(곱빼기 가능:.*\)/g, '').trim();
        }

        function calcDoublePrice() {
            const doubleCb = document.getElementById('doubleSizeCb');
            if(doubleCb.checked) {
                selected.menu = selected.rawMenuName.replace(/\(곱빼기 가능:.*\)/g, '').trim() + " (곱빼기)";
            } else {
                selected.menu = selected.rawMenuName.replace(/\(곱빼기 가능:.*\)/g, '').trim();
            }
        }

        function switchAdminTab(tabNum) {
            document.getElementById('tabBtn1').classList.toggle('active', tabNum === 1);
            document.getElementById('tabBtn2').classList.toggle('active', tabNum === 2);
            document.getElementById('adminTabContent1').classList.toggle('hidden', tabNum !== 1);
            document.getElementById('adminTabContent2').classList.toggle('hidden', tabNum !== 2);
        }

        function renderAdminDashboard() {
            document.getElementById('adminDashboard').classList.remove('hidden');
            const sideArea = document.getElementById('sideMenuArea');
            if(state.sideMenus && state.sideMenus.length > 0) {
                sideArea.classList.remove('hidden');
                if(!document.getElementById('sideGrid').children.length) {
                    renderGrid('sideGrid', state.sideMenus, (obj) => selectSide(obj), true);
                }
            }

            let listHtml = `<table class="admin-table"><tr><th>성함</th><th>메뉴</th><th>가격</th><th style="text-align:center;">제외</th></tr>`;
            let totalEmployeesCount = state.employees.length;
            let currentExcludedCount = 0;
            let currentTotalPrice = 0;
            let currentMenuStats = {};

            let userOrdersMap = {};
            state.orderData.forEach(order => {
                if(!order.name.includes("[사이드]")) {
                    if(!userOrdersMap[order.name]) userOrdersMap[order.name] = [];
                    userOrdersMap[order.name].push(order);
                }
            });

            state.employees.forEach(empName => {
                const orders = userOrdersMap[empName] || [];
                const isExcluded = excludedUsers.has(empName);
                const rowClass = isExcluded ? 'class="excluded-row"' : '';
                const checked = isExcluded ? 'checked' : '';

                if (isExcluded) currentExcludedCount++;

                if (orders.length === 0) {
                    listHtml += `<tr ${rowClass}>
                        <td>${empName}</td>
                        <td><span class="not-selected">메뉴 미선택</span></td>
                        <td>0원</td>
                        <td style="text-align:center;"><input type="checkbox" class="exclude-cb" ${checked} onchange="toggleExclude('${empName}')"></td>
                    </tr>`;
                } else {
                    let menusArray = orders.map(o => o.menu.replace('(개인사이드)','').trim());
                    let subTotal = orders.reduce((sum, o) => sum + (Number(o.price) || 0), 0);

                    listHtml += `<tr ${rowClass}>
                        <td>${empName}</td>
                        <td>${menusArray.join(' + ')}</td>
                        <td>${subTotal.toLocaleString()}원</td>
                        <td style="text-align:center;"><input type="checkbox" class="exclude-cb" ${checked} onchange="toggleExclude('${empName}')"></td>
                    </tr>`;

                    if (!isExcluded) {
                        orders.forEach(o => {
                            let cleanMenuName = o.menu.replace('(개인사이드)','').trim();
                            currentMenuStats[cleanMenuName] = (currentMenuStats[cleanMenuName] || 0) + 1;
                        });
                        currentTotalPrice += subTotal;
                    }
                }
            });

            state.orderData.forEach((order, idx) => {
                if (order.name.includes("[사이드]")) {
                    const uniqueKey = `side_${idx}`;
                    const isExcluded = excludedUsers.has(uniqueKey);
                    const rowClass = isExcluded ? 'class="excluded-row"' : '';
                    const checked = isExcluded ? 'checked' : '';

                    listHtml += `<tr ${rowClass}>
                        <td><span style="color:#00ff88; font-weight:bold;">[사이드]</span></td>
                        <td>${order.menu.replace('(사이드)','').trim()}</td>
                        <td>${Number(order.price).toLocaleString()}원</td>
                        <td style="text-align:center;"><input type="checkbox" class="exclude-cb" ${checked} onchange="toggleExclude('${uniqueKey}')"></td>
                    </tr>`;

                    if (!isExcluded) {
                        let cleanMenuName = order.menu.replace('(사이드)','').trim();
                        currentMenuStats[cleanMenuName] = (currentMenuStats[cleanMenuName] || 0) + 1;
                        currentTotalPrice += Number(order.price);
                    }
                }
            });

            listHtml += `</table>`;
            document.getElementById('adminOrderList').innerHTML = listHtml;

            let currentEatingCount = totalEmployeesCount - currentExcludedCount;
            let summaryHtml = `<strong>📋 전체 메뉴별 취합 (제외자 미포함)</strong><br>`;
            for (const [menu, count] of Object.entries(currentMenuStats)) { summaryHtml += `- ${menu}: ${count}개<br>`; }
            
            summaryHtml += `<hr style="border-color:var(--primary); margin:10px 0;">`;
            summaryHtml += `<strong>💰 실제 결제 인원: ${currentEatingCount}명 (전체 ${totalEmployeesCount}명 중 ${currentExcludedCount}명 제외)</strong><br>`;
            summaryHtml += `<strong>💸 최종 정산 합계: ${currentTotalPrice.toLocaleString()}원</strong>`;
            summaryHtml += `<hr style="border-color:var(--primary); margin:10px 0;">`;
            summaryHtml += `📱 식당 번호: <span style="color:#ffffff; font-weight:bold;">${state.phone || "미등록"}</span>`;
            
            document.getElementById('adminSummary').innerHTML = summaryHtml;
        }

        // 💡 [①번 반영] 조회 룸 고도화: 날짜 및 식당 다중/단일 필터 세팅
        function renderHistoryLogRoom() {
            if(!state.historyData || state.historyData.length === 0) return;
            const resSelect = document.getElementById('filterRestaurant');
            const dateSelect = document.getElementById('filterDate');
            
            if(resSelect.children.length === 1) {
                let uniqueRes = [...new Set(state.historyData.map(h => h.restaurant))];
                uniqueRes.forEach(r => { resSelect.innerHTML += `<option value="${r}">${r}</option>`; });
            }
            if(dateSelect.children.length === 1) {
                let uniqueDates = [...new Set(state.historyData.map(h => h.date))].sort().reverse();
                uniqueDates.forEach(d => { dateSelect.innerHTML += `<option value="${d}">${d}</option>`; });
            }

            filterHistoryTable();
        }

        function filterHistoryTable() {
            const selectedRes = document.getElementById('filterRestaurant').value;
            const selectedDate = document.getElementById('filterDate').value;
            const tbody = document.getElementById('historyTableBody');
            
            let filteredData = state.historyData;

            if(selectedRes) { filteredData = filteredData.filter(h => h.restaurant === selectedRes); }
            if(selectedDate) { filteredData = filteredData.filter(h => h.date === selectedDate); }

            tbody.innerHTML = '';
            let rev = [...filteredData].reverse();
            
            if(rev.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#64748b;">조건에 맞는 내역이 없습니다.</td></tr>`;
                return;
            }

            rev.forEach(h => {
                tbody.innerHTML += `<tr>
                    <td>${h.date.substring(5)}</td>
                    <td>${h.restaurant}</td>
                    <td>${h.name}</td>
                    <td>${h.menu}</td>
                    <td>${Number(h.price).toLocaleString()}원</td>
                </tr>`;
            });
        }

        function saveTodayHistory() {
            let recordsToSave = [];
            let unselectedUsers = []; 
            let userOrdersMap = {};
            state.orderData.forEach(order => {
                if(!order.name.includes("[사이드]")) {
                    if(!userOrdersMap[order.name]) userOrdersMap[order.name] = [];
                    userOrdersMap[order.name].push(order);
                }
            });

            state.employees.forEach(empName => {
                const isExcluded = excludedUsers.has(empName);
                const hasOrdered = userOrdersMap[empName] && userOrdersMap[empName].length > 0;
                
                if (!isExcluded && !hasOrdered) unselectedUsers.push(empName);
                if (!isExcluded && hasOrdered) {
                    userOrdersMap[empName].forEach(o => { recordsToSave.push({ name: empName, menu: o.menu, price: o.price }); });
                }
            });

            if (unselectedUsers.length > 0) {
                alert(`⚠️ 아직 메뉴를 선택하지 않았거나 제외 처리가 되지 않은 팀원이 있습니다.\n\n대상자: [ ${unselectedUsers.join(', ')} ]`);
                return;
            }

            if(!confirm("현재 화면의 정산 인원과 메뉴 내역을 오늘 자 최종 기록으로 확정 저장하시겠습니까?")) return;

            state.orderData.forEach((order, idx) => {
                if (order.name.includes("[사이드]") && !excludedUsers.has(`side_${idx}`)) {
                    recordsToSave.push({ name: "[사이드]", menu: order.menu, price: order.price });
                }
            });

            fetch(GAS_URL, {
                method: "POST",
                body: JSON.stringify({ type: "ADMIN_SAVE_HISTORY", restaurant: state.winner, records: recordsToSave })
            }).then(() => {
                alert("오늘의 점심 최종 내역이 저장되었습니다!");
                updateState();
            });
        }

        function toggleExclude(key) {
            if (excludedUsers.has(key)) { excludedUsers.delete(key); } 
            else { excludedUsers.add(key); }
            renderAdminDashboard();
        }

        function selectSide(obj) {
            fetch(GAS_URL, { method: "POST", body: JSON.stringify({ 
                type: "ORDER", userName: `[사이드] ${obj.name}`, restaurant: state.winner, menu: obj.name, price: obj.price 
            }) }).then(updateState);
        }

        function renderGrid(containerId, data, callback, isMenu = false) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerText = isMenu ? `${item.name.replace(/\(곱빼기 가능:.*\)/g, '').trim()}\n${Number(item.price).toLocaleString()}원` : item;
                div.onclick = () => {
                    container.querySelectorAll('.item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    callback(item);
                };
                container.appendChild(div);
            });
        }

        // 💡 [④번 반영] 메뉴 랜덤 슬롯머신에 블러 및 역동적인 컬러 스케일 이펙트 강화 효과 부여
        function randomMenuSlot() {
            const items = document.querySelectorAll('#menuGrid .item');
            if(!items.length) return;
            const btn = document.getElementById('randomBtn');
            btn.disabled = true; btn.innerText = "🎰 메뉴 셔플 중...";
            
            let count = 0; 
            const maxRolls = 20; // 셔플 회수를 늘려 더 긴장감 조성
            
            const interval = setInterval(() => {
                items.forEach(el => el.classList.remove('slot-rolling'));
                
                // 랜덤하게 무작위 타겟들에게 롤링 클래스 분사
                const randIdx1 = Math.floor(Math.random() * items.length);
                const randIdx2 = Math.floor(Math.random() * items.length);
                items[randIdx1].classList.add('slot-rolling');
                items[randIdx2].classList.add('slot-rolling');
                
                if(count++ > maxRolls) {
                    clearInterval(interval);
                    items.forEach(el => el.classList.remove('slot-rolling'));
                    
                    // 최종 한 장 엄선하여 자동 선택(클릭) 처리
                    const finalChoice = items[Math.floor(Math.random() * items.length)];
                    finalChoice.click();
                    
                    // 선택된 메뉴 강조 효과
                    finalChoice.style.transition = "0.3s";
                    finalChoice.style.transform = "scale(1.1)";
                    setTimeout(() => finalChoice.style.transform = "scale(1.0)", 300);

                    btn.disabled = false; 
                    btn.innerText = "🎲 슬롯머신 재가동";
                }
            }, 80); // 속도를 빠르게 당겨서 더 역동적으로 표현
        }

        function startLocalTimer(endTime) {
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const diff = endTime - new Date().getTime();
                if(diff <= 0) { clearInterval(timerInterval); updateState(); return; }
                const m = Math.floor(diff / 60000), s = Math.floor((diff % 60000) / 1000);
                document.getElementById('voteTimer').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }, 200);
        }

        function startSystem() {
            if(!confirm("모든 기록을 초기화하고 투표를 시작하시겠습니까?")) return;
            fetch(GAS_URL, { method: "POST", body: JSON.stringify({ type: "ADMIN_START" }) }).then(() => {
                alert("투표가 시작되었습니다!"); location.reload();
            });
        }

        function sendVote() { fetch(GAS_URL, { method: "POST", body: JSON.stringify({ type: "VOTE", deviceId: deviceId, choice: selected.res }) }); }
        
        function submitOrder() {
            if(!selected.user || !selected.menu) return alert("이름과 메인 메뉴를 선택해주세요!");
            let checkedSides = [];
            document.querySelectorAll('.pside-cb:checked').forEach(cb => {
                checkedSides.push({ name: cb.getAttribute('data-name'), price: Number(cb.getAttribute('data-price')) });
            });

            localStorage.setItem('ordered_6.0', 'true');
            setFormDisabled(true);

            let finalMainPrice = selected.price;
            const doubleCb = document.getElementById('doubleSizeCb');
            if(doubleCb && doubleCb.checked) { finalMainPrice += selected.doubleFee; }

            fetch(GAS_URL, { 
                method: "POST", 
                body: JSON.stringify({ 
                    type: "MULTI_ORDER", userName: selected.user, restaurant: state.winner, mainMenu: selected.menu, mainPrice: finalMainPrice, sides: checkedSides
                }) 
            }).then(updateState);
        }

        function reOrder() { localStorage.removeItem('ordered_6.0'); setFormDisabled(false); updateState(); }
        function setFormDisabled(disabled) {
            document.getElementById('formContainer').classList.toggle('hidden', disabled);
            document.getElementById('orderedMsg').classList.toggle('hidden', !disabled);
        }

        setInterval(updateState, 5000);
        updateState();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunch Pro v6.0</title>
    <style>
        :root { --primary: #00ff88; --bg: #0f172a; --card: #1e293b; --accent: #f43f5e; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: white; margin: 0; text-align: center; }
        .container { max-width: 480px; margin: 0 auto; padding: 20px; }
        .card { background: var(--card); padding: 30px; border-radius: 24px; border: 1px solid #475569; margin-bottom: 20px; position: relative; }
        .timer { font-size: 64px; color: var(--primary); font-weight: 800; margin: 10px 0; font-variant-numeric: tabular-nums; }
        .guide-text { font-size: 13px; color: #94a3b8; line-height: 1.5; margin-bottom: 15px; }
        .rule-text { font-size: 13px; color: #fba51a; font-weight: bold; line-height: 1.5; margin: 5px 0 15px 0; background: rgba(251, 165, 26, 0.1); padding: 8px; border-radius: 8px; border: 1px dashed rgba(251, 165, 26, 0.3); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .item { background: #0f172a; padding: 18px; border-radius: 16px; border: 2px solid #334155; cursor: pointer; transition: 0.1s; position: relative; }
        .item.active { background: var(--primary); color: #0f172a; font-weight: bold; border-color: var(--primary); }
        .btn-main { width: 100%; padding: 20px; background: var(--primary); color: #0f172a; border: none; border-radius: 16px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .progress-container { width: 100%; background: #334155; height: 8px; border-radius: 4px; margin-top: 10px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--primary); transition: 0.3s; width: 0%; }
        .lucky-btn { background: #334155; color: #94a3b8; border: 1px solid #475569; padding: 8px 15px; border-radius: 20px; font-size: 12px; margin-bottom: 15px; cursor: pointer; width: 100%; }
        .hidden { display: none; }
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; background: #0f172a; border-radius: 12px; overflow: hidden; }
        .admin-table th, .admin-table td { padding: 12px; border-bottom: 1px solid #334155; text-align: left; }
        .admin-table th { background: #334155; color: var(--primary); }
        .summary-card { background: rgba(0, 255, 136, 0.1); border: 1px solid var(--primary); padding: 15px; border-radius: 16px; margin-top: 15px; text-align: left; }
        .exclude-cb { transform: scale(1.2); cursor: pointer; }
        .excluded-row { text-decoration: line-through; color: #64748b !important; background: rgba(244, 63, 94, 0.05); }
        .not-selected { color: #f43f5e; font-style: italic; }
        
        /* 개인 사이드바 스타일 */
        .pside-container { background: #0f172a; padding: 12px; border-radius: 12px; border: 1px dashed #475569; text-align: left; margin-top: 15px; }
        .pside-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; font-size: 14px; }
        .pside-item input { transform: scale(1.2); margin-right: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading">⚡ 데이터 동기화 중...</div>

        <div id="adminStartSection" class="hidden" style="background:#334155; padding:15px; border-radius:12px; margin-bottom:20px; border:1px dashed var(--primary);">
            <h3 style="margin:0 0 10px 0; font-size:16px;">🛠 관리자 메뉴</h3>
            <button class="btn-main" onclick="startSystem()">점심 투표 시작 (데이터 초기화)</button>
        </div>

        <div id="waitingSection" class="hidden">
            <div class="card"><h2>😴 대기 중</h2><p style="color:#94a3b8;">관리자가 투표를 시작하면 활성화됩니다.</p></div>
        </div>

        <div id="votingSection" class="hidden">
            <div class="card">
                <h2>🍴 식당 투표</h2>
                <div class="timer" id="voteTimer">00:00</div>
                <div class="rule-text">📢 식당은 과반수로 정해지게 됩니다<br>(미투표 시 투표인원들 중 과반수로 가게 됨)</div>
                <div class="guide-text">식당 변경은 시간 내 가능하며 마지막 선택이 반영됩니다.</div>
                <div class="progress-container"><div id="voteProgress" class="progress-bar"></div></div>
                <p id="voteCountText" style="font-size:12px; color:var(--primary); margin-top:5px;"></p>
                <div class="grid" id="resGrid"></div>
            </div>
        </div>

        <div id="orderingSection" class="hidden">
            <div class="card">
                <h2 id="winnerTitle" style="color:var(--primary)">🏆 오늘의 식당</h2>
                <div id="formContainer">
                    <div class="grid" id="userGrid"></div>
                    <hr style="border:0; border-top:1px solid #334155; margin:20px 0;">
                    <button id="randomBtn" class="lucky-btn" onclick="randomMenuSlot()">🎲 결정 장애? 슬롯머신!</button>
                    <div class="grid" id="menuGrid"></div>
                    
                    <div id="personalSideArea" class="pside-container hidden">
                        <span style="font-size:13px; color:var(--primary); font-weight:bold;">🥤 추가 선택 (선택 사항)</span>
                        <div id="personalSideList" style="margin-top:8px;"></div>
                    </div>

                    <button class="btn-main" id="submitBtn" onclick="submitOrder()" style="margin-top:20px;">주문 제출하기</button>
                </div>
                <div id="orderedMsg" class="hidden">
                    <div style="background:rgba(0,255,136,0.1); padding:15px; border-radius:12px; margin-bottom:15px;">
                        <b style="color:var(--primary)">주문 완료!</b><br>
                        <span style="font-size:13px; color:#94a3b8;">메뉴 변경 시 <b>구수완 사원</b>에게 메신저 부탁드립니다.</span>
                    </div>
                    <button onclick="reOrder()" style="color:#94a3b8; background:none; border:none; text-decoration:underline; cursor:pointer;">메뉴 다시 고르기</button>
                </div>
            </div>
        </div>

        <div id="adminDashboard" class="hidden">
            <div class="card" style="border: 1px solid var(--primary);">
                <h3 style="color:var(--primary); margin-top:0; margin-bottom:15px;">📊 실시간 정산 (어드민)</h3>
                
                <div id="sideMenuArea" class="hidden">
                    <p style="font-size:13px; color:var(--primary); text-align:left; font-weight:bold;">✨ 사이드 메뉴 일괄 추가 (중복 가능)</p>
                    <div class="grid" id="sideGrid" style="margin-bottom:20px;"></div>
                </div>

                <div id="adminOrderList"></div>
                <div id="adminSummary" class="summary-card"></div>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwg7HqxKAvqaloKaq7OPEEizELNqOJhjLyuuOYHLByCATjXcbRCNy6X1RZREzgjJsTQcA/exec";
        const isAdmin = new URLSearchParams(window.location.search).get('admin') === 'true';
        if(!localStorage.getItem('deviceId')) localStorage.setItem('deviceId', 'id_' + Math.random().toString(36).substr(2, 9));
        const deviceId = localStorage.getItem('deviceId');
        
        let state = {};
        let selected = { res: null, user: null, menu: null, price: 0 };
        let excludedUsers = new Set(); 
        let timerInterval;

        async function updateState() {
            try {
                const res = await fetch(GAS_URL + "?type=get");
                state = await res.json();
                renderUI();
                if(isAdmin && state.status === "ORDERING") renderAdminDashboard();
            } catch (e) {}
        }

        function renderUI() {
            document.getElementById('loading').classList.add('hidden');
            if(isAdmin) document.getElementById('adminStartSection').classList.remove('hidden');
            ['waitingSection', 'votingSection', 'orderingSection'].forEach(s => document.getElementById(s).classList.add('hidden'));

            if(state.status === "WAITING") {
                document.getElementById('waitingSection').classList.remove('hidden');
            } else if(state.status === "VOTING") {
                document.getElementById('votingSection').classList.remove('hidden');
                if(!document.getElementById('resGrid').children.length) 
                    renderGrid('resGrid', state.restaurants, (v) => { selected.res = v; sendVote(); });
                startLocalTimer(state.endTime);
                const percent = (state.voteCount / state.totalCount) * 100;
                document.getElementById('voteProgress').style.width = percent + '%';
                document.getElementById('voteCountText').innerText = `참여 현황: ${state.voteCount} / ${state.totalCount}`;
            } else if(state.status === "ORDERING") {
                document.getElementById('orderingSection').classList.remove('hidden');
                document.getElementById('winnerTitle').innerText = `🏆 ${state.winner}`;
                
                if(!document.getElementById('userGrid').children.length) {
                    renderGrid('userGrid', state.employees, (v) => selected.user = v);
                    renderGrid('menuGrid', state.menus, (obj) => { selected.menu = obj.name; selected.price = obj.price; }, true);
                    
                    // 🥤 개인 사이드 메뉴 그리기
                    const pSideArea = document.getElementById('personalSideArea');
                    const pSideList = document.getElementById('personalSideList');
                    if(state.personalSides && state.personalSides.length > 0) {
                        pSideArea.classList.remove('hidden');
                        pSideList.innerHTML = '';
                        state.personalSides.forEach((side, idx) => {
                            pSideList.innerHTML += `
                                <div class="pside-item">
                                    <label><input type="checkbox" class="pside-cb" data-name="${side.name}" data-price="${side.price}"> ${side.name.replace('(개인사이드)','').trim()}</label>
                                    <span style="color:#94a3b8;">+${side.price.toLocaleString()}원</span>
                                </div>`;
                        });
                    } else {
                        pSideArea.classList.add('hidden');
                    }
                }
                const isOrdered = localStorage.getItem('ordered_6.0');
                setFormDisabled(!!isOrdered);
            }
        }

        function renderAdminDashboard() {
            document.getElementById('adminDashboard').classList.remove('hidden');
            
            const sideArea = document.getElementById('sideMenuArea');
            if(state.sideMenus && state.sideMenus.length > 0) {
                sideArea.classList.remove('hidden');
                if(!document.getElementById('sideGrid').children.length) {
                    renderGrid('sideGrid', state.sideMenus, (obj) => selectSide(obj), true);
                }
            }

            let listHtml = `<table class="admin-table"><tr><th>성함</th><th>메뉴</th><th>가격</th><th style="text-align:center;">제외</th></tr>`;
            
            let totalEmployeesCount = state.employees.length;
            let currentExcludedCount = 0;
            let currentTotalPrice = 0;
            let currentMenuStats = {};

            // 유저별 주문 매핑 구조화 (1명이 여러 개 시켰을 수 있음 - 메인 + 개인사이드)
            let userOrdersMap = {};
            state.orderData.forEach(order => {
                if(!order.name.includes("[사이드]")) {
                    if(!userOrdersMap[order.name]) userOrdersMap[order.name] = [];
                    userOrdersMap[order.name].push(order);
                }
            });

            // Employees 전체 명단 기준으로 테이블 마크업 생성
            state.employees.forEach(empName => {
                const orders = userOrdersMap[empName] || [];
                const isExcluded = excludedUsers.has(empName);
                const rowClass = isExcluded ? 'class="excluded-row"' : '';
                const checked = isExcluded ? 'checked' : '';

                if (isExcluded) currentExcludedCount++;

                if (orders.length === 0) {
                    // 메뉴 미선택자
                    listHtml += `<tr ${rowClass}>
                        <td>${empName}</td>
                        <td><span class="not-selected">메뉴 미선택</span></td>
                        <td>0원</td>
                        <td style="text-align:center;"><input type="checkbox" class="exclude-cb" ${checked} onchange="toggleExclude('${empName}')"></td>
                    </tr>`;
                } else {
                    // 메뉴 선택자 (여러 개 시켰을 경우 병합 표시)
                    let menusArray = orders.map(o => o.menu.replace('(개인사이드)','').trim());
                    let subTotal = orders.reduce((sum, o) => sum + (Number(o.price) || 0), 0);

                    listHtml += `<tr ${rowClass}>
                        <td>${empName}</td>
                        <td>${menusArray.join(' + ')}</td>
                        <td>${subTotal.toLocaleString()}원</td>
                        <td style="text-align:center;"><input type="checkbox" class="exclude-cb" ${checked} onchange="toggleExclude('${empName}')"></td>
                    </tr>`;

                    if (!isExcluded) {
                        orders.forEach(o => {
                            let cleanMenuName = o.menu.replace('(개인사이드)','').trim();
                            currentMenuStats[cleanMenuName] = (currentMenuStats[cleanMenuName] || 0) + 1;
                        });
                        currentTotalPrice += subTotal;
                    }
                }
            });

            // 관리자 전용 일괄 사이드 추가분 처리
            state.orderData.forEach((order, idx) => {
                if (order.name.includes("[사이드]")) {
                    const uniqueKey = `side_${idx}`;
                    const isExcluded = excludedUsers.has(uniqueKey);
                    const rowClass = isExcluded ? 'class="excluded-row"' : '';
                    const checked = isExcluded ? 'checked' : '';

                    listHtml += `<tr ${rowClass}>
                        <td><span style="color:#00ff88; font-weight:bold;">[사이드]</span></td>
                        <td>${order.menu.replace('(사이드)','').trim()}</td>
                        <td>${Number(order.price).toLocaleString()}원</td>
                        <td style="text-align:center;"><input type="checkbox" class="exclude-cb" ${checked} onchange="toggleExclude('${uniqueKey}')"></td>
                    </tr>`;

                    if (!isExcluded) {
                        let cleanMenuName = order.menu.replace('(사이드)','').trim();
                        currentMenuStats[cleanMenuName] = (currentMenuStats[cleanMenuName] || 0) + 1;
                        currentTotalPrice += Number(order.price);
                    }
                }
            });

            listHtml += `</table>`;
            document.getElementById('adminOrderList').innerHTML = listHtml;

            // 요약 결과 계산 및 출력
            let currentEatingCount = totalEmployeesCount - currentExcludedCount;
            
            let summaryHtml = `<strong>📋 전체 메뉴별 취합 (사이드 포함 / 제외자 미포함)</strong><br>`;
            let statCount = 0;
            for (const [menu, count] of Object.entries(currentMenuStats)) {
                summaryHtml += `- ${menu}: ${count}개<br>`;
                statCount++;
            }
            if(statCount === 0) summaryHtml += `<span style="color:#64748b;">주문 내역이 없습니다.</span><br>`;
            
            summaryHtml += `<hr style="border-color:var(--primary); margin:10px 0;">`;
            summaryHtml += `<strong>💰 실제 결제 인원: ${currentEatingCount}명 (전체 ${totalEmployeesCount}명 중 ${currentExcludedCount}명 제외)</strong><br>`;
            summaryHtml += `<strong>💸 최종 정산 합계: ${currentTotalPrice.toLocaleString()}원</strong>`;
            summaryHtml += `<hr style="border-color:var(--primary); margin:10px 0;">`;
            // 📞 전화번호 하단 배치 완료
            summaryHtml += `📱 식당 번호: <span style="color:#ffffff; font-weight:bold;">${state.phone || "미등록"}</span>`;
            
            document.getElementById('adminSummary').innerHTML = summaryHtml;
        }

        function toggleExclude(key) {
            if (excludedUsers.has(key)) { excludedUsers.delete(key); } 
            else { excludedUsers.add(key); }
            renderAdminDashboard();
        }

        function selectSide(obj) {
            fetch(GAS_URL, { method: "POST", body: JSON.stringify({ 
                type: "ORDER", userName: `[사이드] ${obj.name}`, restaurant: state.winner, menu: obj.name, price: obj.price 
            }) }).then(updateState);
        }

        function renderGrid(containerId, data, callback, isMenu = false) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerText = isMenu ? `${item.name}\n${item.price.toLocaleString()}원` : item;
                div.onclick = () => {
                    container.querySelectorAll('.item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    callback(item);
                };
                container.appendChild(div);
            });
        }

        function randomMenuSlot() {
            const items = document.querySelectorAll('#menuGrid .item');
            if(!items.length) return;
            const btn = document.getElementById('randomBtn');
            btn.disabled = true; btn.innerText = "🎰 고르는 중...";
            let count = 0; const maxRolls = 15;
            const interval = setInterval(() => {
                items.forEach(el => el.classList.remove('slot-rolling'));
                items[Math.floor(Math.random() * items.length)].classList.add('slot-rolling');
                if(count++ > maxRolls) {
                    clearInterval(interval);
                    items.forEach(el => el.classList.remove('slot-rolling'));
                    items[Math.floor(Math.random() * items.length)].click();
                    btn.disabled = false; btn.innerText = "🎲 다시 돌리기";
                }
            }, 100);
        }

        function startLocalTimer(endTime) {
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const diff = endTime - new Date().getTime();
                if(diff <= 0) { clearInterval(timerInterval); updateState(); return; }
                const m = Math.floor(diff / 60000), s = Math.floor((diff % 60000) / 1000);
                document.getElementById('voteTimer').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }, 200);
        }

        function startSystem() {
            if(!confirm("모든 기록을 초기화하고 투표를 시작하시겠습니까?")) return;
            fetch(GAS_URL, { method: "POST", body: JSON.stringify({ type: "ADMIN_START" }) }).then(() => {
                alert("투표가 시작되었습니다!"); location.reload();
            });
        }

        function sendVote() { fetch(GAS_URL, { method: "POST", body: JSON.stringify({ type: "VOTE", deviceId: deviceId, choice: selected.res }) }); }
        
        function submitOrder() {
            if(!selected.user || !selected.menu) return alert("이름과 메인 메뉴를 선택해주세요!");
            
            // 🥤 선택한 개인 사이드 메뉴(체크박스) 수집
            let checkedSides = [];
            document.querySelectorAll('.pside-cb:checked').forEach(cb => {
                checkedSides.push({
                    name: cb.getAttribute('data-name'),
                    price: Number(cb.getAttribute('data-price'))
                });
            });

            localStorage.setItem('ordered_6.0', 'true');
            setFormDisabled(true);

            fetch(GAS_URL, { 
                method: "POST", 
                body: JSON.stringify({ 
                    type: "MULTI_ORDER", 
                    userName: selected.user, 
                    restaurant: state.winner, 
                    mainMenu: selected.menu, 
                    mainPrice: selected.price,
                    sides: checkedSides
                }) 
            }).then(updateState);
        }

        function reOrder() { localStorage.removeItem('ordered_6.0'); setFormDisabled(false); updateState(); }
        function setFormDisabled(disabled) {
            document.getElementById('formContainer').classList.toggle('hidden', disabled);
            document.getElementById('orderedMsg').classList.toggle('hidden', !disabled);
        }

        setInterval(updateState, 5000);
        updateState();
    </script>
</body>
</html>
